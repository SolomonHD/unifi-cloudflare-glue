[build-system]
requires = ["uv_build==0.8.24"]
build-backend = "uv_build"

[project]
name = "main"
version = "0.14.0"
requires-python = ">=3.11"
dependencies = [
    "dagger-io",
    "pyyaml==6.0.3",
    "python-hcl2==8.2.0",
    "dagger-clients-core",
]

[tool.uv.sources]
dagger-io = { workspace = true }
dagger-clients-core = { workspace = true }

[tool.uv]
build-constraint-dependencies = ["uv_build==0.8.24"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "black==26.10.1",
    "isort==9.0.2",
    "mypy==2.4.1",
    "types-PyYAML==6.0.12.20261113",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "generator: marks tests as generator output validation tests",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.uv.workspace]
members = ["sdk", "clients/core"]

[tool.dagger]
global-client = true
